[project]
name = "hammerz-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "pydantic-settings",
    "email-validator",
    "argon2-cffi",
    "httpx",
    "pyjwt",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "respx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
seed-demo = "src.modules.seed:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "BLE001", "TRY203", "SIM103", "S110", "SIM102"]
