name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hammerz
          POSTGRES_PASSWORD: hammerz
          POSTGRES_DB: hammerz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hammerz -d hammerz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://hammerz:hammerz@127.0.0.1:5432/hammerz
      JWT_SECRET: ci-jwt-secret-32-characters-min
      HMAC_SECRET: ci-hmac-secret-32-characters-min
      ALIAS_SECRET: ci-alias-secret-32-characters-min
      DEPLOYMENT_ID: hammerz-ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Backend lint and test
        working-directory: backend
        run: |
          uv sync --extra dev
          uv run ruff check .
          uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: SPA build
        working-directory: frontend
        run: |
          npm ci
          npm run build
